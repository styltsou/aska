name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect deploy changes
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: "none"
          filters: |
            # Deploy on a push to main iff something that can affect the running
            # app changed. Docs/MD-only, extension-only and website-only changes
            # are skipped; the website deploys to Cloudflare on its own.
            deploy:
              - 'apps/web/**'
              - 'apps/server/**'
              - 'services/**'
              - 'packages/**'
              - 'scripts/**'
              - 'sst.config.ts'
              - 'sst-env.d.ts'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - 'turbo.json'
              - '.github/workflows/**'

  quality:
    name: Checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aska
      BETTER_AUTH_SECRET: 01234567890123456789012345678901
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_test
      TURBO_TELEMETRY_DISABLED: 1
      # Turbo runs only the packages a change touches, plus every package that
      # depends on them (from the workspace dependencies in package.json). A
      # change to a file listed in turbo.json's globalDependencies runs all.
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      # One install at the repo root covers every workspace package.
      - run: bun install --frozen-lockfile
      - run: bunx turbo run lint typecheck lambda:typecheck format test build db:check --affected --continue

  deploy-dev:
    name: Deploy AWS dev
    needs: [quality, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Retrigger deployment after rotating the dev database secret.
    # The first media deployment provisions an ACM certificate and a new
    # CloudFront distribution, both of which can take longer than the normal
    # application-only update.
    timeout-minutes: 35
    concurrency:
      group: mnemee-dev-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # One install at the repo root covers SST and every workspace package.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::089972278413:role/aska-github-actions-deploy
          role-session-name: aska-github-actions-deploy
      # `sst secret set` updates the stage state synchronously. The migration
      # shell can read that staged value directly; a targeted deploy here is
      # unsafe because SST still evaluates all subscriptions, including new
      # queues that are not part of the DatabaseUrl target.
      - name: Apply database migrations
        run: bunx sst shell --print-logs --stage dev -- bun run scripts/migrate-stage.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Deploy SST dev stage
        run: bunx sst deploy --stage dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: mnemee@${{ github.sha }}
      - name: Smoke test AI streaming API
        run: |
          ai_url="https://api.mnemee.space/api/ai"
          status="$(curl --silent --show-error --output /tmp/ai-health.txt --write-out '%{http_code}' "$ai_url/health")"
          test "$status" = "200"
          test "$(cat /tmp/ai-health.txt)" = "ok"
          status="$(curl --silent --show-error --output /tmp/ai-options.txt --dump-header /tmp/ai-options.headers --write-out '%{http_code}' --request OPTIONS --header 'Origin: http://localhost:5173' --header 'Access-Control-Request-Method: POST' "$ai_url/stream")"
          test "$status" = "200"
          grep -iq '^access-control-allow-origin: http://localhost:5173' /tmp/ai-options.headers
          status="$(curl --silent --show-error --output /tmp/ai-unauthorized.txt --write-out '%{http_code}' --request POST --header 'Origin: http://localhost:5173' --header 'Content-Type: application/json' --data '{"prompt":"test","note":""}' "$ai_url/stream")"
          test "$status" = "401"
      - name: Queue missing video storyboards
        run: bunx sst shell --stage dev -- bun run --cwd apps/server backfill:video-storyboards --enqueue --wait
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
