name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      image-variants: ${{ steps.filter.outputs.image-variants }}
      image-palette: ${{ steps.filter.outputs.image-palette }}
      image-shared: ${{ steps.filter.outputs.image-shared }}
      url-unfurl-shared: ${{ steps.filter.outputs.url-unfurl-shared }}
      url-resolution: ${{ steps.filter.outputs.url-resolution }}
      video-processor: ${{ steps.filter.outputs.video-processor }}
      gradient-naming: ${{ steps.filter.outputs.gradient-naming }}
      extension: ${{ steps.filter.outputs.extension }}
      website: ${{ steps.filter.outputs.website }}
      infra: ${{ steps.filter.outputs.infra }}
      workspace: ${{ steps.filter.outputs.workspace }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: "none"
          filters: |
            client:
              - 'client/**'
            server:
              - 'server/**'
            image-variants:
              - 'services/image-variants/**'
            image-palette:
              - 'services/image-palette/**'
            image-shared:
              - 'services/image-shared/**'
            url-unfurl-shared:
              - 'services/url-unfurl-shared/**'
            url-resolution:
              - 'services/url-resolution/**'
            video-processor:
              - 'services/video-processor/**'
            gradient-naming:
              - 'services/gradient-naming/**'
            extension:
              - 'extension/**'
            website:
              - 'website/**'
            infra:
              - 'sst.config.ts'
              - 'sst-env.d.ts'
            # The single workspace install (and this workflow) affects every
            # package, so changes here run every quality job.
            workspace:
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.github/workflows/ci.yml'
            # Deploy on a push to main iff something that can affect the running
            # app changed. Docs/MD-only, extension-only and website-only changes
            # are skipped; the website deploys to Cloudflare on its own.
            deploy:
              - 'client/**'
              - 'server/**'
              - 'services/**'
              - 'scripts/**'
              - 'sst.config.ts'
              - 'sst-env.d.ts'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.github/workflows/**'

  quality:
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aska
      BETTER_AUTH_SECRET: 01234567890123456789012345678901
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_test
    strategy:
      fail-fast: false
      matrix:
        # Filter outputs are the strings 'true'/'false', and a non-empty string
        # is truthy in expressions, so compare each one explicitly.
        include:
          - name: Client
            directory: client
            command: bun run lint && bun run typecheck && bun run format && bun run test && bun run build
            changed: ${{ needs.changes.outputs.client == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: Server
            directory: server
            command: ""
            # Server depends on both shared packages and reads the SST config.
            changed: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.infra == 'true' || needs.changes.outputs.image-shared == 'true' || needs.changes.outputs.url-unfurl-shared == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: Image shared
            directory: services/image-shared
            command: bun run lint && bun run typecheck && bun run format
            changed: ${{ needs.changes.outputs.image-shared == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: Image variants
            directory: services/image-variants
            command: bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.image-variants == 'true' || needs.changes.outputs.image-shared == 'true' || needs.changes.outputs.url-unfurl-shared == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: Image palette
            directory: services/image-palette
            command: bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.image-palette == 'true' || needs.changes.outputs.image-shared == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: URL unfurl shared
            directory: services/url-unfurl-shared
            command: bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.url-unfurl-shared == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: URL resolution
            directory: services/url-resolution
            command: bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.url-resolution == 'true' || needs.changes.outputs.url-unfurl-shared == 'true' || needs.changes.outputs.image-shared == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: Video processor
            directory: services/video-processor
            command: bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.video-processor == 'true' || needs.changes.outputs.image-shared == 'true' || needs.changes.outputs.url-unfurl-shared == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: Gradient naming
            directory: services/gradient-naming
            command: bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.gradient-naming == 'true' || needs.changes.outputs.image-shared == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: Extension
            directory: extension
            command: bun run build
            changed: ${{ needs.changes.outputs.extension == 'true' || needs.changes.outputs.workspace == 'true' }}
          - name: Website
            directory: website
            command: bun run build
            changed: ${{ needs.changes.outputs.website == 'true' || needs.changes.outputs.workspace == 'true' }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      # A job-level `if` is evaluated before matrix expansion, so guard every
      # step instead. This leaves unchanged matrix entries as successful no-ops.
      - if: fromJSON(matrix.changed)
        uses: actions/checkout@v4
      - if: fromJSON(matrix.changed)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - if: fromJSON(matrix.changed)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # One install at the repo root covers every workspace package.
      - if: fromJSON(matrix.changed)
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run lint
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run typecheck
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run lambda:typecheck
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run format
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run test
      - if: fromJSON(matrix.changed) && matrix.name != 'Server'
        run: ${{ matrix.command }}
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run db:generate && git diff --exit-code

  deploy-dev:
    name: Deploy AWS dev
    needs: [quality, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Retrigger deployment after rotating the dev database secret.
    # The first media deployment provisions an ACM certificate and a new
    # CloudFront distribution, both of which can take longer than the normal
    # application-only update.
    timeout-minutes: 35
    concurrency:
      group: mnemee-dev-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      # One install at the repo root covers SST and every workspace package.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::089972278413:role/aska-github-actions-deploy
          role-session-name: aska-github-actions-deploy
      # `sst secret set` updates the stage state synchronously. The migration
      # shell can read that staged value directly; a targeted deploy here is
      # unsafe because SST still evaluates all subscriptions, including new
      # queues that are not part of the DatabaseUrl target.
      - name: Apply database migrations
        run: bunx sst shell --print-logs --stage dev -- bun run scripts/migrate-stage.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Deploy SST dev stage
        run: bunx sst deploy --stage dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: mnemee@${{ github.sha }}
      - name: Smoke test AI streaming API
        run: |
          ai_url="https://api.mnemee.space/api/ai"
          status="$(curl --silent --show-error --output /tmp/ai-health.txt --write-out '%{http_code}' "$ai_url/health")"
          test "$status" = "200"
          test "$(cat /tmp/ai-health.txt)" = "ok"
          status="$(curl --silent --show-error --output /tmp/ai-options.txt --dump-header /tmp/ai-options.headers --write-out '%{http_code}' --request OPTIONS --header 'Origin: http://localhost:5173' --header 'Access-Control-Request-Method: POST' "$ai_url/stream")"
          test "$status" = "200"
          grep -iq '^access-control-allow-origin: http://localhost:5173' /tmp/ai-options.headers
          status="$(curl --silent --show-error --output /tmp/ai-unauthorized.txt --write-out '%{http_code}' --request POST --header 'Origin: http://localhost:5173' --header 'Content-Type: application/json' --data '{"prompt":"test","note":""}' "$ai_url/stream")"
          test "$status" = "401"
      - name: Queue missing video storyboards
        run: bunx sst shell --stage dev -- bun run --cwd server backfill:video-storyboards --enqueue --wait
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
