name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aska
      BETTER_AUTH_SECRET: 01234567890123456789012345678901
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Infrastructure
            directory: .
            command: bun run test:infra
          - name: Client
            directory: client
            command: bun run lint && bun run typecheck && bun run format && bun run test && bun run build
          - name: Server
            directory: server
            command: bun run lint && bun run typecheck && bun run format && bun run test
          - name: Image variants
            directory: services/image-variants
            command: bun install --frozen-lockfile --cwd ../image-shared && bun run lint && bun run typecheck && bun run format && bun run test
          - name: Image palette
            directory: services/image-palette
            command: bun install --frozen-lockfile --cwd ../image-shared && bun run lint && bun run typecheck && bun run format && bun run test
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - if: matrix.name == 'Server'
        run: bun run lint
      - if: matrix.name == 'Server'
        run: bun run typecheck
      - if: matrix.name == 'Server'
        run: bun run format
      - if: matrix.name == 'Server'
        run: bun run test
      - if: matrix.name != 'Server'
        run: ${{ matrix.command }}
      - if: matrix.name == 'Server'
        run: bun run db:generate && git diff --exit-code

  deploy-dev:
    name: Deploy AWS dev
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The first media deployment provisions an ACM certificate and a new
    # CloudFront distribution, both of which can take longer than the normal
    # application-only update.
    timeout-minutes: 35
    concurrency:
      group: aska-dev-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install SST
        run: bun install --frozen-lockfile
      - name: Install application dependencies
        run: |
          bun install --frozen-lockfile --cwd client
          bun install --frozen-lockfile --cwd server
          bun install --frozen-lockfile --cwd services/image-shared
          bun install --frozen-lockfile --cwd services/image-variants
          bun install --frozen-lockfile --cwd services/image-palette
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::089972278413:role/aska-github-actions-deploy
          role-session-name: aska-github-actions-deploy
      - name: Validate CloudFront media signing key
        run: bun infra/validate-cloudfront-private-key.ts
        env:
          CLOUDFRONT_MEDIA_PRIVATE_KEY_BASE64: ${{ secrets.CLOUDFRONT_MEDIA_PRIVATE_KEY_BASE64 }}
      - name: Sync CloudFront media signing key to SST
        run: bunx sst secret set CloudFrontMediaPrivateKeyBase64 "$CLOUDFRONT_MEDIA_PRIVATE_KEY_BASE64" --stage dev
        env:
          CLOUDFRONT_MEDIA_PRIVATE_KEY_BASE64: ${{ secrets.CLOUDFRONT_MEDIA_PRIVATE_KEY_BASE64 }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ secrets.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_ACCESS_AUD: ${{ secrets.CLOUDFLARE_ACCESS_AUD }}
      - name: Deploy SST dev stage
        run: bunx sst deploy --stage dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_ACCESS_TEAM_DOMAIN: ${{ secrets.CLOUDFLARE_ACCESS_TEAM_DOMAIN }}
          CLOUDFLARE_ACCESS_AUD: ${{ secrets.CLOUDFLARE_ACCESS_AUD }}
          OTEL_ENABLED: ${{ secrets.OTEL_ENABLED }}
          OTEL_SERVICE_NAME: ${{ secrets.OTEL_SERVICE_NAME }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT }}
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_METRICS_ENDPOINT }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
