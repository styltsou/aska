name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      image-variants: ${{ steps.filter.outputs.image-variants }}
      image-palette: ${{ steps.filter.outputs.image-palette }}
      image-shared: ${{ steps.filter.outputs.image-shared }}
      url-unfurl-shared: ${{ steps.filter.outputs.url-unfurl-shared }}
      url-resolution: ${{ steps.filter.outputs.url-resolution }}
      video-processor: ${{ steps.filter.outputs.video-processor }}
      infra: ${{ steps.filter.outputs.infra }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          list-files: "none"
          filters: |
            client:
              - 'client/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            image-variants:
              - 'services/image-variants/**'
              - '.github/workflows/ci.yml'
            image-palette:
              - 'services/image-palette/**'
              - '.github/workflows/ci.yml'
            image-shared:
              - 'services/image-shared/**'
            url-unfurl-shared:
              - 'services/url-unfurl-shared/**'
              - '.github/workflows/ci.yml'
            url-resolution:
              - 'services/url-resolution/**'
              - '.github/workflows/ci.yml'
            video-processor:
              - 'services/video-processor/**'
              - 'services/image-shared/**'
              - 'services/url-unfurl-shared/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'sst.config.ts'
              - 'sst-env.d.ts'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'
            # Deploy on a push to main iff something that can affect the running
            # app changed. Docs/MD-only PRs are skipped.
            deploy:
              - 'client/**'
              - 'server/**'
              - 'services/**'
              - 'scripts/**'
              - 'sst.config.ts'
              - 'sst-env.d.ts'
              - 'package.json'
              - 'bun.lock'
              - '.github/workflows/**'

  quality:
    name: ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aska
      BETTER_AUTH_SECRET: 01234567890123456789012345678901
      BETTER_AUTH_URL: http://localhost:3000
      RESEND_API_KEY: re_test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Client
            directory: client
            command: bun run lint && bun run typecheck && bun run format && bun run test && bun run build
            changed: ${{ needs.changes.outputs.client }}
          - name: Server
            directory: server
            command: bun run lint && bun run typecheck && bun run format && bun run test
            # Server also runs when the SST/infra config or shared deps change.
            changed: ${{ needs.changes.outputs.server || needs.changes.outputs.infra || needs.changes.outputs.image-shared || needs.changes.outputs.url-unfurl-shared }}
          - name: Image variants
            directory: services/image-variants
            command: bun install --frozen-lockfile --cwd ../image-shared && bun install --frozen-lockfile --cwd ../url-unfurl-shared && bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.image-variants || needs.changes.outputs.image-shared || needs.changes.outputs.url-unfurl-shared }}
          - name: Image palette
            directory: services/image-palette
            command: bun install --frozen-lockfile --cwd ../image-shared && bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.image-palette || needs.changes.outputs.image-shared }}
          - name: URL unfurl shared
            directory: services/url-unfurl-shared
            command: bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.url-unfurl-shared }}
          - name: URL resolution
            directory: services/url-resolution
            command: bun install --frozen-lockfile --cwd ../url-unfurl-shared && bun install --frozen-lockfile --cwd ../image-shared && bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.url-resolution || needs.changes.outputs.url-unfurl-shared || needs.changes.outputs.image-shared }}
          - name: Video processor
            directory: services/video-processor
            command: bun install --frozen-lockfile --cwd ../image-shared && bun install --frozen-lockfile --cwd ../url-unfurl-shared && bun run lint && bun run typecheck && bun run format && bun run test
            changed: ${{ needs.changes.outputs.video-processor || needs.changes.outputs.image-shared || needs.changes.outputs.url-unfurl-shared }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      # A job-level `if` is evaluated before matrix expansion, so guard every
      # step instead. This leaves unchanged matrix entries as successful no-ops.
      - if: fromJSON(matrix.changed)
        uses: actions/checkout@v4
      - if: fromJSON(matrix.changed)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - if: fromJSON(matrix.changed)
        run: bun install --frozen-lockfile
      # Server's typecheck follows imports into the shared service packages
      # (image-shared, url-unfurl-shared), so their deps must be installed too.
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun install --frozen-lockfile --cwd ../services/image-shared
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun install --frozen-lockfile --cwd ../services/url-unfurl-shared
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run lint
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run typecheck
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run lambda:typecheck
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run format
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run test
      - if: fromJSON(matrix.changed) && matrix.name != 'Server'
        run: ${{ matrix.command }}
      - if: fromJSON(matrix.changed) && matrix.name == 'Server'
        run: bun run db:generate && git diff --exit-code

  deploy-dev:
    name: Deploy AWS dev
    needs: [quality, changes]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    # Retrigger deployment after rotating the dev database secret.
    # The first media deployment provisions an ACM certificate and a new
    # CloudFront distribution, both of which can take longer than the normal
    # application-only update.
    timeout-minutes: 35
    concurrency:
      group: aska-dev-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install SST
        run: bun install --frozen-lockfile
      - name: Install application dependencies
        run: |
          bun install --frozen-lockfile --cwd client
          bun install --frozen-lockfile --cwd server
          bun install --frozen-lockfile --cwd services/image-shared
          bun install --frozen-lockfile --cwd services/image-variants
          bun install --frozen-lockfile --cwd services/image-palette
          bun install --frozen-lockfile --cwd services/gradient-naming
          bun install --frozen-lockfile --cwd services/url-unfurl-shared
          bun install --frozen-lockfile --cwd services/url-resolution
          bun install --frozen-lockfile --cwd services/video-processor
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::089972278413:role/aska-github-actions-deploy
          role-session-name: aska-github-actions-deploy
      # `sst secret set` updates the stage state synchronously. The migration
      # shell can read that staged value directly; a targeted deploy here is
      # unsafe because SST still evaluates all subscriptions, including new
      # queues that are not part of the DatabaseUrl target.
      - name: Apply database migrations
        run: bunx sst shell --print-logs --stage dev -- bun run scripts/migrate-stage.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
      - name: Deploy SST dev stage
        run: bunx sst deploy --stage dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: aska@${{ github.sha }}
      - name: Diagnose AI stream Lambda
        run: |
          function_name="$(aws lambda list-functions --query 'Functions[?contains(FunctionName, `AiApiRoute`)].FunctionName | [0]' --output text)"
          test "$function_name" != "None"
          resource_id="$(aws apigateway get-resources --rest-api-id 77do6h6v54 --query 'items[?path==`/health`].id | [0]' --output text)"
          aws apigateway get-integration --rest-api-id 77do6h6v54 --resource-id "$resource_id" --http-method GET
          aws lambda get-policy --function-name "$function_name"
          log_group="$(aws lambda get-function-configuration --function-name "$function_name" --query 'LoggingConfig.LogGroup' --output text)"
          aws apigateway get-account --query '{cloudwatchRoleArn:cloudwatchRoleArn}'
          aws apigateway get-stage --rest-api-id 77do6h6v54 --stage-name dev --query '{stageName:stageName,accessLogSettings:accessLogSettings,methodSettings:methodSettings}'
          aws apigateway update-stage --rest-api-id 77do6h6v54 --stage-name dev --patch-operations 'op=replace,path=/accessLogSettings/format,value=$context.requestId $context.status $context.integrationErrorMessage $context.error.message $context.integration.status' --query 'accessLogSettings'
          bun --cwd server -e 'import { LambdaClient, InvokeWithResponseStreamCommand } from "@aws-sdk/client-lambda"; const response = await new LambdaClient({}).send(new InvokeWithResponseStreamCommand({ FunctionName: process.argv[1], Payload: new TextEncoder().encode("{}") })); for await (const event of response.EventStream) { if (event.PayloadChunk) process.stdout.write(new TextDecoder().decode(event.PayloadChunk.Payload)); if (event.InvokeComplete) console.log(event.InvokeComplete); }' "$function_name" || true
          aws apigateway test-invoke-method --rest-api-id 77do6h6v54 --resource-id "$resource_id" --http-method GET
          curl --silent --show-error --no-buffer "https://aska-api.styltsou.com/ai/health?ci-probe=${GITHUB_SHA}" || true
          sleep 5
          aws logs tail /aws/vendedlogs/apis/aska-dev-AiApi-cuozfaou --since 10m || true
          aws logs tail "$log_group" --since 5m || true
      - name: Queue missing video storyboards
        run: bunx sst shell --stage dev -- bun run --cwd server backfill:video-storyboards --enqueue --wait
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
